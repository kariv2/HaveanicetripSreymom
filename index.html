<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Safe Travel, Kry Sreymom</title>
  <!-- Google Fonts for Romantic Love Letter Aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b1325;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. SKY CANVAS (Clouds, Airplane, Heart Trail & Stars) */
    #flight-canvas {
      position: fixed;
      inset: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 35%, #415a77 65%, #778da9 85%, #d4a373 100%);
    }

    #sky-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 230, 200, 0.05) 0%, rgba(10, 15, 25, 0.55) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* ==========================================================
       2. ROMANTIC LOVE LETTER CARD (FLOATING IN CLOUDS)
       ========================================================== */
    #wish-container {
      position: fixed;
      left: 0; right: 0;
      bottom: 7vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
      padding: 0 16px;
    }

    .wish-card {
      width: min(92vw, 600px);
      min-height: 220px;
      padding: 28px 32px;
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.07) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 255, 255, 0.38);
      border-radius: 26px;
      box-shadow: 
        0 24px 50px rgba(10, 15, 30, 0.55),
        0 0 35px rgba(255, 225, 180, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      animation: gentleFloat 5s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    /* Badge: ✈︎ Safe Travel na ♡ */
    .wish-badge {
      font-family: 'Caveat', cursive;
      font-size: clamp(21px, 3.2vw, 26px);
      color: #ffd166;
      text-shadow: 0 0 14px rgba(255, 209, 102, 0.7);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
      min-height: 32px;
    }

    /* Phrase 2: "Have a nice trip, enjoy it to the fullest" */
    .wish-main {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-size: clamp(22px, 3.6vw, 34px);
      font-weight: 600;
      font-style: italic;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 
        0 2px 14px rgba(0, 0, 0, 0.85),
        0 0 25px rgba(255, 240, 210, 0.45);
      margin-bottom: 10px;
      min-height: 44px;
    }

    /* Phrase 3: Care note */
    .wish-sub {
      font-family: 'Caveat', cursive;
      font-size: clamp(17px, 2.3vw, 22px);
      color: #fceade;
      opacity: 0.95;
      line-height: 1.45;
      letter-spacing: 0.03em;
      margin-bottom: 14px;
      min-height: 30px;
    }

    .card-divider {
      width: 60px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(255, 209, 102, 0.6), transparent);
      margin: 0 auto 12px auto;
      transition: opacity 0.8s ease;
    }

    /* Signature: "Aku cinta kamu, Kry Sreymom. ♡" */
    .wish-sign {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-size: clamp(18px, 2.5vw, 23px);
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #ffcad4;
      text-shadow: 0 0 12px rgba(255, 202, 212, 0.75);
      min-height: 28px;
    }

    /* Signoff: "— from someone who love you" */
    .wish-from {
      font-family: 'Caveat', cursive;
      font-size: clamp(16px, 2.2vw, 20px);
      color: #ffd166;
      letter-spacing: 0.06em;
      margin-top: 6px;
      opacity: 0.95;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
      min-height: 24px;
    }

    /* Romantic Blinking Cursor */
    .romantic-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #ffd166;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Dense Floating Drawing Doodles */
    .flight-heart {
      position: fixed;
      font-family: monospace;
      color: #ffcad4;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 0 12px rgba(255, 202, 212, 0.9), 0 0 22px rgba(255, 209, 102, 0.55);
      animation: floatHeart 5.5s ease-out forwards;
    }
    @keyframes floatHeart {
      0% { opacity: 0; transform: translateY(0) scale(0.65) rotate(0deg); }
      18% { opacity: 0.95; transform: translateY(-30px) scale(1.08) rotate(var(--rot, 6deg)); }
      75% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-400px) scale(1.3) rotate(calc(var(--rot, 6deg) * 2)); }
    }

    /* ==========================================================
       3. START SCREEN ("PLAY" BUTTON)
       ========================================================== */
    #start-screen {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(10, 16, 28, 0.94) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff4e6;
      z-index: 999999 !important;
      cursor: pointer;
      pointer-events: auto !important;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      width: 100%;
      max-width: 280px;
    }

    #start-btn {
      width: 100%;
      padding: 16px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #ffd166, #f4a261);
      color: #1a0f05;
      border: 1px solid rgba(255, 240, 210, 0.85);
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(244, 162, 97, 0.5);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    #start-btn:active { transform: scale(0.96); }

    .upload-container {
      position: relative;
      width: 100%;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      text-align: center;
      overflow: hidden;
    }
    .upload-container input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .subtitle {
      margin-top: 14px;
      opacity: 0.7;
      font-size: 13px;
      color: #94a3b8;
    }

    #song-player {
      position: fixed;
      bottom: 10px; right: 10px;
      width: 2px; height: 2px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body onclick="startTrip()">

  <!-- Media Player: Auto-detects your MP4 file -->
  <video id="song-player" playsinline webkit-playsinline loop preload="auto"></video>

  <!-- Flight Canvas (Drawing Airplane, Clouds & Heart Trail) -->
  <canvas id="flight-canvas"></canvas>
  <div id="sky-overlay"></div>

  <!-- Romantic Love Letter Card -->
  <div id="wish-container">
    <div class="wish-card">
      <div class="wish-badge" id="type-badge"></div>
      <h1 class="wish-main" id="type-main"></h1>
      <p class="wish-sub" id="type-sub"></p>
      
      <div class="card-divider" id="type-divider" style="opacity: 0;"></div>
      
      <p class="wish-sign" id="type-sign"></p>
      <p class="wish-from" id="type-from"></p>
    </div>
  </div>

  <!-- Start Screen with simple "play" button -->
  <div id="start-screen" onclick="startTrip()">
    <div class="btn-group" onclick="event.stopPropagation()">
      <button id="start-btn" onclick="startTrip()" ontouchend="startTrip()">
        ▶ play
      </button>

      <div class="upload-container">
        <span id="upload-label">📁 or choose .mp4 from iPad</span>
        <input type="file" id="media-input" accept="video/*,audio/*" onchange="handleMediaUpload(this)">
      </div>
    </div>
    <p class="subtitle" id="status-text">⏳ scanning your GitHub files for audio...</p>
  </div>

  <script>
    // ==============================================================
    // 1. AUTO-DETECT AUDIO ENGINE
    // ==============================================================
    const player = document.getElementById('song-player');
    const statusText = document.getElementById('status-text');

    async function autoDetectMedia() {
      try {
        const hostParts = window.location.hostname.split('.');
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const user = (hostParts.length > 2 && hostParts[1] === 'github') ? hostParts[0] : 'kariv2';
        const repo = pathParts[0] || 'Ahnhem';

        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
        if (res.ok) {
          const files = await res.json();
          const found = files.find(f => f.type === 'file' && /\.(mp4|mov|m4a|mp3)$/i.test(f.name));
          if (found) {
            player.src = found.name;
            player.load();
            statusText.innerText = `✓ connected to "${found.name}"`;
            return;
          }
        }
      } catch (err) {}

      const candidates = ['travel.mp4', 'trip.mp4', 'music.mp4', 'video.mp4'];
      for (const name of candidates) {
        try {
          const check = await fetch(name, { method: 'HEAD' });
          if (check.ok) {
            player.src = name;
            player.load();
            statusText.innerText = `✓ connected to "${name}"`;
            return;
          }
        } catch (e) {}
      }
      player.src = candidates[0];
      statusText.innerText = "(tap play to begin)";
    }
    autoDetectMedia();

    function handleMediaUpload(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        player.src = URL.createObjectURL(file);
        player.load();
        document.getElementById('upload-label').innerText = "✓ mp4 connected!";
        statusText.innerText = "ready! tap play now.";
      }
    }

    // ==============================================================
    // 2. ROMANTIC LETTER-BY-LETTER TYPEWRITER ENGINE
    // ==============================================================
    function typeInto(element, text, speed) {
      return new Promise((resolve) => {
        let i = 0;
        const cursor = document.createElement('span');
        cursor.className = 'romantic-cursor';
        element.appendChild(cursor);

        const timer = setInterval(() => {
          if (i < text.length) {
            cursor.insertAdjacentText('beforebegin', text[i]);
            i++;
          } else {
            clearInterval(timer);
            cursor.remove();
            resolve();
          }
        }, speed);
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function playRomanticLetter() {
      // 1. Badge with drawing plane and heart
      await typeInto(document.getElementById('type-badge'), '✈︎ Safe Travel na ♡', 45);
      await sleep(250);

      // 2. Main Wish: "Have a nice trip, enjoy it to the fullest"
      await typeInto(document.getElementById('type-main'), '"Have a nice trip, enjoy it to the fullest"', 40);
      await sleep(300);

      // 3. Third Phrase (Care & Comeback Safely)
      await typeInto(document.getElementById('type-sub'), 'fly safe, take care of your self, your health, make beautiful memories and comeback safely.', 32);
      await sleep(250);

      // Divider appears
      document.getElementById('type-divider').style.opacity = '1';
      await sleep(250);

      // 4. Romantic Dedication
      await typeInto(document.getElementById('type-sign'), 'Aku cinta kamu, Kry Sreymom. ♡', 50);
      await sleep(350);

      // 5. From someone who love you
      await typeInto(document.getElementById('type-from'), '— from someone who love you', 50);
    }

    // ==============================================================
    // 3. CANVAS: DRAWING AIRPLANE, CLOUDS & HEART CONTRAIL
    // ==============================================================
    const canvas = document.getElementById('flight-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    let clouds = [];
    let sparkles = [];
    let flightTick = 0;
    let planeX, planeY;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      planeX = width * 0.48;
      initClouds();
    }

    function initClouds() {
      clouds = [];
      for (let i = 0; i < 14; i++) {
        clouds.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.65),
          scale: Math.random() * 0.8 + 0.6,
          speed: Math.random() * 0.45 + 0.2,
          opacity: Math.random() * 0.35 + 0.25
        });
      }

      sparkles = [];
      for (let i = 0; i < 28; i++) {
        sparkles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.5 + 1,
          pulse: Math.random() * Math.PI
        });
      }
    }

    function drawFluffyCloud(x, y, s, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = `rgba(255, 245, 235, ${opacity})`;
      ctx.beginPath();
      ctx.arc(0, 0, 45, 0, Math.PI * 2);
      ctx.arc(40, -18, 38, 0, Math.PI * 2);
      ctx.arc(80, 0, 42, 0, Math.PI * 2);
      ctx.arc(40, 15, 35, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawSketchedAirplane(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const s = width > 800 ? 1.0 : 0.78;
      ctx.scale(s, s);

      ctx.strokeStyle = '#ffffff';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(255, 225, 180, 0.8)';
      ctx.shadowBlur = 18;

      ctx.beginPath();
      ctx.moveTo(-70, 0);
      ctx.quadraticCurveTo(-20, -18, 60, -12);
      ctx.quadraticCurveTo(85, -2, 85, 2);
      ctx.quadraticCurveTo(60, 12, -70, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();

      // Top wing
      ctx.beginPath();
      ctx.moveTo(-10, -5);
      ctx.lineTo(-30, -55);
      ctx.lineTo(5, -50);
      ctx.lineTo(15, -4);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();

      // Lower wing
      ctx.beginPath();
      ctx.moveTo(-10, 5);
      ctx.lineTo(-25, 38);
      ctx.lineTo(5, 35);
      ctx.lineTo(15, 4);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();

      // Tail
      ctx.beginPath();
      ctx.moveTo(-60, -2);
      ctx.lineTo(-85, -34);
      ctx.lineTo(-70, -32);
      ctx.lineTo(-50, 0);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();

      // Windows
      ctx.fillStyle = '#1b263b';
      for (let w = 0; w < 4; w++) {
        ctx.beginPath();
        ctx.arc(w * 14 - 10, 0, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawHeartContrail(tailX, tailY) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 235, 210, 0.75)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 8]);
      ctx.shadowColor = 'rgba(255, 200, 150, 0.6)';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      const hx = tailX - 140;
      const hy = tailY + 15;
      ctx.quadraticCurveTo(tailX - 60, tailY - 35, hx, hy);
      ctx.stroke();

      ctx.beginPath();
      const hr = 28;
      ctx.arc(hx - hr/2, hy - hr/2, hr/2, Math.PI, 0, false);
      ctx.arc(hx + hr/2, hy - hr/2, hr/2, Math.PI, 0, false);
      ctx.lineTo(hx, hy + hr * 0.7);
      ctx.closePath();
      ctx.stroke();

      ctx.restore();
    }

    function drawScene() {
      ctx.clearRect(0, 0, width, height);

      sparkles.forEach(p => {
        p.pulse += 0.03;
        const a = Math.sin(p.pulse) * 0.4 + 0.5;
        ctx.fillStyle = `rgba(255, 245, 210, ${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });

      clouds.forEach(c => {
        c.x -= c.speed;
        drawFluffyCloud(c.x, c.y, c.scale, c.opacity);
        if (c.x < -150) {
          c.x = width + 150;
          c.y = Math.random() * (height * 0.65);
        }
      });

      flightTick += 0.022;
      planeY = height * 0.25 + Math.sin(flightTick) * 18;
      const flightAngle = Math.cos(flightTick) * 0.06 - 0.04;

      drawHeartContrail(planeX - 70, planeY);
      drawSketchedAirplane(planeX, planeY, flightAngle);

      requestAnimationFrame(drawScene);
    }

    window.addEventListener('resize', resize);
    resize();
    drawScene();

    // ==============================================================
    // 4. START TRIP / AUDIO ENGINE
    // ==============================================================
    let hasStarted = false;

    function startTrip() {
      if (hasStarted) return;
      hasStarted = true;

      const screen = document.getElementById('start-screen');
      if (screen) screen.style.display = 'none';

      player.muted = false;
      player.loop = true;
      player.play().catch(e => console.log("Audio play:", e));

      setInterval(spawnFlightHeart, 180);
      playRomanticLetter();
    }

    function spawnFlightHeart() {
      const symbols = ['♡', '♥', '<3', '✈︎', '✨', '⋆｡°', '˙ᵕ˙', 'ʚɞ', '☁', '✧'];
      const el = document.createElement('div');
      el.className = 'flight-heart';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      
      const size = Math.floor(14 + Math.random() * 13);
      el.style.fontSize = `${size}px`;

      const rot = (Math.random() - 0.5) * 28;
      el.style.setProperty('--rot', `${rot}deg`);
      
      const x = Math.floor(Math.random() * (window.innerWidth - 40));
      const y = Math.floor(window.innerHeight * 0.88);

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 5500);
    }

    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', startTrip);
    startBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      startTrip();
    });
  </script>
</body>
          </html>
